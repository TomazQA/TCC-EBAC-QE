name: TCC EBAC QE - Testes Automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    name: Testes de API (Supertest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: ./API
        run: npm install

      - name: Rodar testes de API
        working-directory: ./API
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_USER: ${{ secrets.API_USER }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: npm test

  ui-tests:
    name: Testes de UI (Cypress)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: ./UI
        run: npm install

      - name: Rodar testes de UI
        working-directory: ./UI
        run: npm run cy:run

      - name: Publicar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cypress
          path: UI/reports
